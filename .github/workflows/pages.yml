# Vista previa estática del sitio público en GitHub Pages.
# El sitio completo (reservas + panel) se publica en Vercel: ver docs/INTEGRACIONES.md.
name: Vista previa en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/preparar-pages.mjs
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Fotos y precios de ejemplo (src/config/ejemplo.ts), sólo en esta vista previa.
          NEXT_PUBLIC_DEMO: "true"
          NEXT_PUBLIC_SITE_URL: https://titanterremoto.github.io/sofia-pink-flamingo
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
